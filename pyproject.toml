[project]
name = "annotool"
version = "0.1.0"
description = "Local emotion annotation & review tool"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annotool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
